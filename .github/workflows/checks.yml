# Vérifications automatiques à chaque push : types de l'interface et tests Rust.
# Elles tournent sur Linux (plus rapide) ; la compilation Windows reste dans build.yml.
name: Vérifications

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un nouveau push annule le run encore en cours sur la même branche (ou le même tag) :
# seule la dernière version compte.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Vérification des types (svelte-check)
        run: npm run check
      - name: Build de l'interface (nécessaire à la compilation Rust)
        run: npm run build
      - name: Bibliothèques système pour Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Tests Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml
