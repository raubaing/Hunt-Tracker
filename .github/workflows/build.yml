# Build de test : compile Hunt Tracker pour Windows à chaque push sur main.
# Le .exe est dans l'onglet Actions > dernier run > "Artifacts" (HuntTracker-windows).
# Pour publier une version (et la proposer en mise à jour automatique), lancer le workflow « Release ».
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push annule le run encore en cours : seule la dernière version compte.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          # Clé de signature des mises à jour (Settings > Secrets and variables > Actions)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: HuntTracker-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/hunt-tracker.exe
