# Compile Hunt Tracker pour Windows sur les serveurs GitHub.
# - À chaque push sur main (ou lancement manuel) : le .exe est disponible
#   dans l'onglet Actions > dernier run > "Artifacts".
# - Sur un tag "v*" (ex. v0.1.0) : crée en plus une Release (brouillon) avec l'installeur.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "Hunt Tracker ${{ github.ref_name }}"
          releaseBody: "Télécharge le fichier *-setup.exe ci-dessous pour installer."
          releaseDraft: true
      - uses: actions/upload-artifact@v4
        with:
          name: HuntTracker-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/hunt-tracker.exe
